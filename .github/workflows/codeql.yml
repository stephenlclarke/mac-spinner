# Run GitHub CodeQL analysis for changes, scheduled scans, and manual requests.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Initialise Swift analysis, let CodeQL build the package, then publish results.
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: autobuild
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
