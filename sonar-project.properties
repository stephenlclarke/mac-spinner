# Identify the SonarCloud project and scanner organization.
sonar.projectKey=stephenlclarke_mac-spinner
sonar.organization=stephenlclarke
sonar.projectName=mac-spinner
sonar.projectVersion=0.1.0
# Scan maintained Swift sources and tests, then import the generated generic coverage report.
sonar.sources=Sources
sonar.tests=Tests
sonar.test.inclusions=**/*Tests.swift
sonar.coverageReportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
